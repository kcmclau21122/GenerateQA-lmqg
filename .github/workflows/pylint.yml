name: Pylint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pylint
        run: python -m pip install --upgrade pip pylint
      # Errors only, matching the local pre-commit hook. Project dependencies
      # are not installed here, so unresolved imports are not reported.
      - name: Run pylint
        run: git ls-files -z '*.py' | xargs -0 --no-run-if-empty pylint --errors-only --disable=import-error
